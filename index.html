<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timescout.AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: linear-gradient(180deg, #0b1522 0%, #111c2d 100%);
      color: #e5e9f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .app {
      width: 100%;
      max-width: 860px;
      height: 92vh;
      background: #1b2838;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      padding: 16px 18px;
      background: #223247;
      border-bottom: 1px solid #31445c;
    }
    .header h1 { margin: 0; font-size: 1.4rem; }
    .header p { margin: 6px 0 0; color: #d8dee9; font-size: 0.9rem; }
    .main {
      display: grid;
      grid-template-columns: 320px 1fr;
      flex: 1;
      min-height: 0;
    }
    .sidebar {
      border-right: 1px solid #31445c;
      padding: 16px;
      background: #1a2635;
      overflow-y: auto;
    }
    .chat-area {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: #162231;
    }
    .section-title {
      margin: 0 0 10px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #88c0d0;
    }
    label {
      display: block;
      margin-top: 10px;
      font-size: 0.88rem;
      color: #d8dee9;
    }
    input[type="number"], input[type="text"] {
      width: 100%;
      margin-top: 5px;
      padding: 9px 10px;
      border-radius: 6px;
      border: 1px solid #3b4252;
      background: #2e3440;
      color: #e5e9f0;
      font-size: 0.95rem;
    }
    input:focus {
      outline: 1px solid #88c0d0;
      border-color: #88c0d0;
    }
    .sidebar-buttons {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }
    button {
      padding: 10px 12px;
      border: none;
      border-radius: 6px;
      background: #5e81ac;
      color: #eceff4;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #81a1c1; }
    .ghost-btn { background: #35485f; }
    .ghost-btn:hover { background: #48627f; }
    .mic-btn.listening { background: #bf616a; }
    .status-box {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #243447;
      color: #d8dee9;
      font-size: 0.85rem;
      line-height: 1.45;
    }
    .chatbox {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 82%;
      padding: 12px 14px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .bot {
      align-self: flex-start;
      background: #2a3c52;
      color: #edf2f7;
    }
    .user {
      align-self: flex-end;
      background: #5e81ac;
      color: #f8fbff;
    }
    .composer {
      border-top: 1px solid #31445c;
      padding: 14px 16px;
      background: #1b2838;
    }
    .input-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
    }
    .note {
      margin-top: 8px;
      font-size: 0.8rem;
      color: #b9c4d3;
      line-height: 1.4;
    }
    .state-above { color: #a3be8c; }
    .state-at    { color: #ebcb8b; }
    .state-below { color: #bf616a; }
    .state-none  { color: #d08770; }

    @media (max-width: 860px) {
      .main { grid-template-columns: 1fr; }
      .sidebar {
        border-right: none;
        border-bottom: 1px solid #31445c;
      }
    }

    @media (max-width: 600px) {
      .app { height: 96vh; }
      .message { max-width: 92%; }
      .input-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>Timescout.AI</h1>
      <p>A navigator assistant for energy, resistance, and coherent work time.</p>
    </div>

    <div class="main">
      <div class="sidebar">
        <h2 class="section-title">Navigator inputs</h2>

        <label>Environmental energy
          <input type="number" id="env" step="0.01" min="0" max="1" value="0.2">
        </label>

        <label>Emotional energy
          <input type="number" id="emo" step="0.01" min="0" max="1" value="0.2">
        </label>

        <label>Mental energy
          <input type="number" id="ment" step="0.01" min="0" max="1" value="0.2">
        </label>

        <label>Physical energy
          <input type="number" id="phys" step="0.01" min="0" max="1" value="0.2">
        </label>

        <label>Resistance R
          <input type="number" id="res" step="0.01" min="0.01" max="1" value="0.2">
        </label>

        <div class="sidebar-buttons">
          <button onclick="runCommand('status report')">Status report</button>
          <button class="ghost-btn" onclick="runCommand('save state')">Save state</button>
          <button class="ghost-btn" onclick="runCommand('load state')">Load state</button>
          <button class="ghost-btn" onclick="runCommand('reset inputs')">Reset inputs</button>
        </div>

        <div class="status-box" id="statusBox">
          MER = (Agency / Resistance) × φ, with φ = 1.618033988749895
        </div>
      </div>

      <div class="chat-area">
        <div class="chatbox" id="chatbox" aria-live="polite"></div>

        <div class="composer">
          <div class="input-row">
            <input type="text" id="userInput" placeholder="Try: status report, save state, set mental energy to 0.8">
            <button type="button" class="mic-btn" id="micBtn" onclick="toggleVoiceInput()">🎤 Speak</button>
            <button type="button" onclick="sendMessage()">Send</button>
          </div>
          <div class="note">
            Commands: status report, save state, load state, reset inputs, help,
            set environmental energy to 0.6, set resistance to 0.3
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const PHI = 1.618033988749895;
    let recognition = null;
    let isListening = false;

    function clampToNumber(x) {
      const v = Number(x);
      return isNaN(v) ? 0 : v;
    }

    function addMessage(text, sender) {
      const chatbox = document.getElementById("chatbox");
      const message = document.createElement("div");
      message.className = `message ${sender}`;
      message.textContent = text;
      chatbox.appendChild(message);
      chatbox.scrollTop = chatbox.scrollHeight;
    }

    function speakText(text) {
      if (!("speechSynthesis" in window)) return;
      const utterance = new SpeechSynthesisUtterance(text);
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }

    function getInputs() {
      return {
        env: clampToNumber(document.getElementById("env").value),
        emo: clampToNumber(document.getElementById("emo").value),
        ment: clampToNumber(document.getElementById("ment").value),
        phys: clampToNumber(document.getElementById("phys").value),
        res: Math.max(clampToNumber(document.getElementById("res").value), 0.0001)
      };
    }

    function setInputs(data) {
      document.getElementById("env").value = data.env ?? 0.2;
      document.getElementById("emo").value = data.emo ?? 0.2;
      document.getElementById("ment").value = data.ment ?? 0.2;
      document.getElementById("phys").value = data.phys ?? 0.2;
      document.getElementById("res").value = data.res ?? 0.2;
    }

    function computeState() {
      const { env, emo, ment, phys, res } = getInputs();
      const agency = env + emo + ment + phys;
      const mer = (agency / res) * PHI;

      let state = "";
      let stateLabel = "";
      let cssClass = "";
      let advice = "";

      if (agency <= 0) {
        state = "no_agency";
        stateLabel = "Navigator not active";
        cssClass = "state-none";
        advice = "No active navigation is happening yet.";
      } else if (mer > PHI) {
        state = "above_phi";
        stateLabel = "Above phi";
        cssClass = "state-above";
        advice = "You are in a coherent state for focused work.";
      } else if (Math.abs(mer - PHI) < 1e-6) {
        state = "at_phi";
        stateLabel = "At phi threshold";
        cssClass = "state-at";
        advice = "You are right at the threshold.";
      } else {
        state = "below_phi";
        stateLabel = "Below phi";
        cssClass = "state-below";
        advice = "Fatigue or decoherence is more likely right now.";
      }

      return { env, emo, ment, phys, res, agency, mer, state, stateLabel, cssClass, advice };
    }

    function updateStatusBox(data) {
      document.getElementById("statusBox").innerHTML = `
        Agency: <strong>${data.agency.toFixed(4)}</strong><br>
        Resistance: <strong>${data.res.toFixed(4)}</strong><br>
        MER: <strong>${data.mer.toFixed(4)}</strong><br>
        State: <strong class="${data.cssClass}">${data.stateLabel}</strong>
      `;
    }

    function saveState() {
      const data = getInputs();
      localStorage.setItem("timescout_state", JSON.stringify(data));
      return "I saved your current navigator state locally in this browser.";
    }

    function loadState() {
      const raw = localStorage.getItem("timescout_state");
      if (!raw) {
        return "I could not find a saved state yet.";
      }
      const data = JSON.parse(raw);
      setInputs(data);
      const state = computeState();
      updateStatusBox(state);
      return "I loaded your last saved navigator state.";
    }

    function resetInputs() {
      setInputs({ env: 0.2, emo: 0.2, ment: 0.2, phys: 0.2, res: 0.2 });
      const state = computeState();
      updateStatusBox(state);
      return "I reset the inputs to the default values.";
    }

    function setFieldByCommand(text) {
      const patterns = [
        { key: "env", names: ["environmental energy", "environment energy", "environment"] },
        { key: "emo", names: ["emotional energy", "emotion", "emotional"] },
        { key: "ment", names: ["mental energy", "mental"] },
        { key: "phys", names: ["physical energy", "physical"] },
        { key: "res", names: ["resistance", "resistance r"] }
      ];

      for (const field of patterns) {
        for (const name of field.names) {
          const regex = new RegExp(`set ${name} to ([0-9]*\\.?[0-9]+)`);
          const match = text.match(regex);
          if (match) {
            let value = parseFloat(match[1]);
            if (field.key === "res") {
              value = Math.min(Math.max(value, 0.01), 1);
            } else {
              value = Math.min(Math.max(value, 0), 1);
            }
            document.getElementById(field.key).value = value;
            const state = computeState();
            updateStatusBox(state);
            return `I set ${name} to ${value.toFixed(2)}.`;
          }
        }
      }
      return null;
    }

    function buildStatusReport() {
      const data = computeState();
      updateStatusBox(data);
      return `Status report:
Agency: ${data.agency.toFixed(4)}
Resistance: ${data.res.toFixed(4)}
Phi: ${PHI.toFixed(4)}
MER: ${data.mer.toFixed(4)}
State: ${data.stateLabel}

${data.advice}`;
    }

    function helpText() {
      return `Here are some things I can do right now:
- status report
- save state
- load state
- reset inputs
- set environmental energy to 0.6
- set emotional energy to 0.7
- set mental energy to 0.8
- set physical energy to 0.5
- set resistance to 0.3`;
    }

    function runCommand(rawText) {
      const text = rawText.toLowerCase().trim();

      const setReply = setFieldByCommand(text);
      if (setReply) {
        return setReply;
      }

      if (text.includes("status")) {
        return buildStatusReport();
      }

      if (text.includes("save")) {
        return saveState();
      }

      if (text.includes("load")) {
        return loadState();
      }

      if (text.includes("reset")) {
        return resetInputs();
      }

      if (text.includes("help") || text.includes("what can you do")) {
        return helpText();
      }

      if (text.includes("study") || text.includes("work")) {
        const data = computeState();
        updateStatusBox(data);
        if (data.state === "above_phi") {
          return "Yes. Your current state supports focused work.";
        }
        if (data.state === "at_phi") {
          return "You can work, but use shorter focus blocks.";
        }
        return "You may want to reduce the load or rest first.";
      }

      const data = computeState();
      updateStatusBox(data);
      return `I understood your message, but I do not have a dedicated command for it yet.
Current MER: ${data.mer.toFixed(4)}
Current state: ${data.stateLabel}

Type help to see what I can do.`;
    }

    function sendMessage() {
      const input = document.getElementById("userInput");
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";

      const reply = runCommand(text);
      addMessage(reply, "bot");
      speakText(reply);
    }

    function initVoiceRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return null;

      const recog = new SpeechRecognition();
      recog.continuous = false;
      recog.interimResults = false;
      recog.lang = "en-US";

      recog.onstart = function () {
        isListening = true;
        document.getElementById("micBtn").classList.add("listening");
        document.getElementById("micBtn").textContent = "🎙️ Listening...";
      };

      recog.onresult = function (event) {
        const transcript = event.results[0][0].transcript;
        addMessage(transcript, "user");
        const reply = runCommand(transcript);
        addMessage(reply, "bot");
        speakText(reply);
      };

      recog.onerror = function () {
        addMessage("Microphone input failed. Please try again or type instead.", "bot");
      };

      recog.onend = function () {
        isListening = false;
        document.getElementById("micBtn").classList.remove("listening");
        document.getElementById("micBtn").textContent = "🎤 Speak";
      };

      return recog;
    }

    function toggleVoiceInput() {
      if (!recognition) {
        recognition = initVoiceRecognition();
      }

      if (!recognition) {
        addMessage("Voice recognition is not supported here. Please type your command instead.", "bot");
        return;
      }

      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    document.getElementById("userInput").addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    function boot() {
      const data = computeState();
      updateStatusBox(data);
      addMessage(
        "Hello, I’m Timescout.AI. I can analyze your state, save and load it, reset inputs, and change values from chat commands. Type help to see commands.",
        "bot"
      );
    }

    boot();
  </script>
</body>
</html>
